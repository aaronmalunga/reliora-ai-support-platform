[project]
name = "reliora-ai-support-platform"
version = "0.1.0"
description = "A production-engineering case study for reliable, observable, and safely controlled AI-assisted customer support on AWS."
readme = "README.md"
authors = [
    { name = "Aaron Malunga" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.87",
    "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reliora"

[tool.mypy]
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src"]


[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]==1.43.87",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "scikit-learn>=1.7,<2",
]
